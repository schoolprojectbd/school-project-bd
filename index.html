
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School Project BD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

/* TOP BAR */
.topbar{
  background:#f85606;
  color:white;
  font-size:13px;
  padding:8px 5%;
  display:flex;
  justify-content:space-between;
}

/* HEADER */
.header{
  background:#ff6900;
  padding:15px 5%;
  display:flex;
  align-items:center;
  gap:25px;
}

.logo{
  color:white;
  font-size:27px;
  font-weight:bold;
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
  background:white;
  border-radius:4px;
  overflow:hidden;
  height:45px;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:0 16px;
  font-size:15px;
}

.search button{
  width:60px;
  border:0;
  background:#ffe1d2;
  color:#f85606;
  font-size:20px;
  cursor:pointer;
}

.cart-btn{
  color:white;
  font-size:27px;
  cursor:pointer;
  position:relative;
}

.cart-count{
  position:absolute;
  background:#fff;
  color:#f85606;
  font-size:11px;
  width:19px;
  height:19px;
  border-radius:50%;
  text-align:center;
  line-height:19px;
  top:-8px;
  right:-10px;
}

/* NAV */
.nav{
  background:white;
  padding:12px 5%;
  display:flex;
  gap:30px;
  box-shadow:0 1px 4px #ddd;
}

.nav a{
  text-decoration:none;
  color:#333;
  font-size:14px;
  cursor:pointer;
}

.nav a:hover{
  color:#f85606;
}

/* HERO */
.hero{
  margin:20px auto;
  max-width:1200px;
  min-height:250px;
  border-radius:6px;
  background:linear-gradient(120deg,#ff6900,#ff9b55);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:35px 55px;
  overflow:hidden;
}

.hero-text h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero-text p{
  font-size:17px;
  margin-bottom:22px;
}

.shop-btn{
  background:white;
  color:#f85606;
  border:0;
  padding:13px 25px;
  border-radius:4px;
  font-weight:bold;
  cursor:pointer;
}

.hero-icon{
  font-size:130px;
}

/* MAIN */
.container{
  max-width:1200px;
  margin:auto;
}

/* SECTION TITLE */
.section-title{
  background:white;
  padding:18px;
  margin-top:20px;
  border-bottom:2px solid #f85606;
}

.section-title h2{
  font-size:22px;
  font-weight:500;
}

/* CATEGORIES */
.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  background:white;
}

.category{
  padding:22px 10px;
  text-align:center;
  border-right:1px solid #eee;
  cursor:pointer;
  transition:.2s;
}

.category:hover{
  box-shadow:0 2px 8px #ddd;
  transform:translateY(-2px);
}

.category-icon{
  font-size:35px;
  margin-bottom:10px;
}

.category p{
  font-size:14px;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:12px;
}

.product{
  background:white;
  border-radius:4px;
  overflow:hidden;
  position:relative;
  transition:.2s;
}

.product:hover{
  box-shadow:0 3px 12px #ccc;
  transform:translateY(-2px);
}

.product-img{
  width:100%;
  height:210px;
  object-fit:contain;
  background:#fff;
  padding:10px;
}

.product-info{
  padding:13px;
}

.product-name{
  font-size:15px;
  line-height:20px;
  min-height:40px;
}

.price{
  color:#f85606;
  font-size:21px;
  margin:9px 0;
  font-weight:bold;
}

.old-price{
  color:#999;
  text-decoration:line-through;
  font-size:13px;
}

.rating{
  color:#f6a800;
  font-size:13px;
  margin-bottom:10px;
}

.buttons{
  display:flex;
  gap:6px;
}

.add-btn,
.buy-btn{
  flex:1;
  padding:10px 5px;
  border:0;
  cursor:pointer;
  font-weight:bold;
  border-radius:3px;
}

.add-btn{
  background:#fff0e8;
  color:#f85606;
  border:1px solid #f85606;
}

.buy-btn{
  background:#f85606;
  color:white;
}

.add-btn:hover{
  background:#ffe1d2;
}

.buy-btn:hover{
  background:#d94700;
}

/* OWNER */
.owner{
  background:white;
  margin-top:25px;
  padding:25px;
  display:flex;
  align
